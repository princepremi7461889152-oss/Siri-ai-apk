name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Unable to detect Java major version."
            exit 1
          fi
          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java version 17 or higher is required. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified: Version $JAVA_MAJOR meets the requirement (17+)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists, skipping creation."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: debug.keystore was not found after creation."
            exit 1
          fi
          echo "Debug keystore is ready."

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ]; then
            SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses > /dev/null || true
            fi
          fi

      - name: Compute release version metadata
        id: version_meta
        run: |
          RUN_NUM="${GITHUB_RUN_NUMBER:-1}"
          NEW_VERSION_CODE=$((3 + RUN_NUM))
          NEW_VERSION_NAME="1.2.${RUN_NUM}"
          echo "version_code=$NEW_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NEW_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Computed Release Version: v${NEW_VERSION_NAME} (versionCode=${NEW_VERSION_CODE})"

      - name: Build the debug APK
        run: >
          gradle :app:assembleDebug --stacktrace --no-daemon
          -PappVersionCode=${{ steps.version_meta.outputs.version_code }}
          -PappVersionName=${{ steps.version_meta.outputs.version_name }}
          -PgithubUpdateRepo=${{ github.repository }}

      - name: Verify the APK
        id: verify_apk
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK file not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file $EXPECTED_APK is empty."
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: Expected APK file does not have .apk extension."; exit 1 ;;
          esac
          APK_SHA256=$(sha256sum "$EXPECTED_APK" | awk '{print $1}')
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "APK successfully verified: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes, sha256=$APK_SHA256)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK and SHA-256 release assets
        id: prepare_asset
        run: |
          RELEASE_DIR=$(mktemp -d)
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_FILE="$RELEASE_DIR/app-debug.apk"
          CHECKSUM_FILE="$RELEASE_DIR/app-debug.apk.sha256"
          cp "$SOURCE_APK" "$RELEASE_FILE"
          if [ ! -f "$RELEASE_FILE" ] || [ ! -s "$RELEASE_FILE" ]; then
            echo "Error: Failed to prepare release asset at $RELEASE_FILE"
            exit 1
          fi
          APK_SHA256=$(sha256sum "$RELEASE_FILE" | awk '{print $1}')
          echo "${APK_SHA256}  app-debug.apk" > "$CHECKSUM_FILE"
          echo "apk_path=$RELEASE_FILE" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$CHECKSUM_FILE" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "Prepared APK release asset at: $RELEASE_FILE (sha256=$APK_SHA256)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.apk_path }}"
          CHECKSUM_PATH="${{ steps.prepare_asset.outputs.checksum_path }}"
          APK_SHA256="${{ steps.prepare_asset.outputs.apk_sha256 }}"
          VERSION_CODE="${{ steps.version_meta.outputs.version_code }}"
          VERSION_NAME="${{ steps.version_meta.outputs.version_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared asset $ASSET_PATH missing or empty."
            exit 1
          fi
          if [ ! -f "$CHECKSUM_PATH" ] || [ ! -s "$CHECKSUM_PATH" ]; then
            echo "Error: Checksum asset $CHECKSUM_PATH missing or empty."
            exit 1
          fi
          if [ "$(basename "$ASSET_PATH")" != "app-debug.apk" ]; then
            echo "Error: Prepared asset filename must be app-debug.apk."
            exit 1
          fi

          RELEASE_TAG="v${VERSION_NAME}+${VERSION_CODE}"
          RELEASE_TITLE="Siri AI Assistant v${VERSION_NAME} (Build ${VERSION_CODE})"

          RELEASE_NOTES="$(printf '%s\n' \
            '### Siri AI Assistant Official Build' \
            '' \
            "- **Version Name**: ${VERSION_NAME}" \
            "- **Version Code**: ${VERSION_CODE}" \
            "- **SHA-256**: ${APK_SHA256}" \
            "- **Commit SHA**: ${{ github.sha }}" \
            "- **Run Number**: ${{ github.run_number }}" \
            '' \
            'Includes always-on offline wake word detection ("Hey Siri" / "Siri"), background foreground service lifecycle stability, and SHA-256 verified in-app updates.')"

          echo "Publishing GitHub Release: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" "$CHECKSUM_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_CODE="${{ steps.version_meta.outputs.version_code }}"
          VERSION_NAME="${{ steps.version_meta.outputs.version_name }}"
          RELEASE_TAG="v${VERSION_NAME}+${VERSION_CODE}"
          RELEASE_TITLE="Siri AI Assistant v${VERSION_NAME} (Build ${VERSION_CODE})"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            echo "=========================================="
            echo "GitHub Release Publication Succeeded!"
            gh release view "$RELEASE_TAG"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Filename: app-debug.apk"
            echo "APK SHA-256: ${{ steps.prepare_asset.outputs.apk_sha256 }}"
            echo "Direct Download URL: $DIRECT_URL"
            echo "=========================================="

            echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Release: **${RELEASE_TITLE}**" >> "$GITHUB_STEP_SUMMARY"
            echo "- SHA-256: \`${{ steps.prepare_asset.outputs.apk_sha256 }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Download: [$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning ::GitHub Release publishing failed or did not run."
            if [ "${{ steps.verify_apk.outcome }}" = "success" ] && [ "${{ steps.upload_artifact.outcome }}" = "success" ]; then
              echo "The APK build succeeded and the backup Actions artifact 'app-debug-apk' remains available."
              echo "### DIRECT APK DOWNLOAD (RELEASE FAILED)" >> "$GITHUB_STEP_SUMMARY"
              echo "> APK build succeeded. The normal Actions artifact \`app-debug-apk\` remains available as a backup." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "APK build or artifact upload did not complete successfully."
              echo "### DIRECT APK DOWNLOAD (BUILD FAILED)" >> "$GITHUB_STEP_SUMMARY"
              echo "> APK build did not succeed." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
